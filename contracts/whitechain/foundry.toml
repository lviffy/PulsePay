[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
whitechain_sepolia = "https://rpc.testnet.whitechain.io"

[etherscan]
whitechain_sepolia = { key = "empty", url = "https://explorer.testnet.whitechain.io/api/" }
