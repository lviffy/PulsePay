[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["../whitechain/lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=../whitechain/lib/openzeppelin-contracts/contracts/",
    "forge-std/=../whitechain/lib/forge-std/src/"
]

[rpc_endpoints]
hedera_testnet = "https://testnet.hashio.io/api"

